name: Continuous Integration

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate:
    name: Validation & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Type Checking
      run: npx tsc --noEmit

    - name: Linting
      run: npm run lint

    - name: Production Build Validation
      run: npm run build
      env:
        # Mocking necessary env vars to pass build without actual DB connection
        # Prisma needs DATABASE_URL to run generate, but Next.js build might fail if it does actual DB calls.
        # We assume build-time data fetching is mocked or doesn't throw if DB is unreachable.
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/studyvisions"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/studyvisions"
        NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_mockkey"
        NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_key"
