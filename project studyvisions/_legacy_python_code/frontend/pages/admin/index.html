<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - StudyVisions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen">
    <!-- Admin Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col">
        <div class="p-4 border-b border-slate-700">
            <h2 class="text-xl font-bold text-white">SV Admin</h2>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="index.html" class="block py-2 px-4 bg-blue-600 text-white rounded-lg font-medium">Dashboard</a>
            <a href="products.html" class="block py-2 px-4 hover:bg-slate-800 rounded-lg">Products</a>
            <a href="orders.html" class="block py-2 px-4 hover:bg-slate-800 rounded-lg">Orders</a>
            <a href="students.html" class="block py-2 px-4 hover:bg-slate-800 rounded-lg">Students</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Admin Dashboard</h1>
            <div class="flex items-center gap-4">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors">+ New Product</button>
                <div class="w-10 h-10 rounded-full bg-slate-200"></div>
            </div>
        </header>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-medium text-slate-500 mb-1">Total Revenue</h3>
                <p class="text-2xl font-bold">₹0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-medium text-slate-500 mb-1">Active Students</h3>
                <p class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-medium text-slate-500 mb-1">Products</h3>
                <p class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-medium text-slate-500 mb-1">Orders Today</h3>
                <p class="text-2xl font-bold">0</p>
            </div>
        </div>
    </main>
</body>
</html>
